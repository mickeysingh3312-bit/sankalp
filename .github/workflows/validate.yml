name: Validate and build

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  flutter:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create Android platform
        working-directory: mobile
        run: bash tool/bootstrap_android.sh
      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Analyze
        working-directory: mobile
        run: flutter analyze
      - name: Test
        working-directory: mobile
        run: flutter test
      - name: Build testing APK
        working-directory: mobile
        run: >-
          flutter build apk --release
          --dart-define=API_BASE_URL=${{ vars.API_BASE_URL }}
      - name: Name APK
        run: |
          app_version="$(awk '/^version:/{print $2}' mobile/pubspec.yaml | cut -d+ -f1)"
          cp mobile/build/app/outputs/flutter-apk/app-release.apk \
            "mobile/build/app/outputs/flutter-apk/Naam-Jap-${app_version}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: naam-jap-test-apk
          path: mobile/build/app/outputs/flutter-apk/Naam-Jap-*.apk
          retention-days: 14

  php:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: curl, mbstring, openssl, pdo_mysql
      - name: PHP syntax check
        run: find backend -name '*.php' -print0 | xargs -0 -n1 php -l
