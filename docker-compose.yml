services:
  api:
    build: ./backend
    ports:
      - "8080:80"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/google-play-service-account.json:/run/secrets/google-play.json:ro
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: sankalp
      MYSQL_USER: sankalp
      MYSQL_PASSWORD: local-password
      MYSQL_ROOT_PASSWORD: local-root-password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:

